name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Generar icono y pantalla de carga
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Barra de estado oscura
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's|<item name="android:background">@null</item>|<item name="android:background">@null</item>\n        <item name="android:statusBarColor">#07040f</item>\n        <item name="android:navigationBarColor">#07040f</item>|' "$f"
          cat "$f"

      - name: Sincronizar la web con Android
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pinovski-Acestream.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Pinovski-Acestream-apk
          path: Pinovski-Acestream.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pinovski Acestream (última versión)
          body: APK de la última compilación.
          files: Pinovski-Acestream.apk
